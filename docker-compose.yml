version: '3.8'

services:
  # Database for WordPress
  db:
    image: mysql:8.0
    container_name: wp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-StrongRootPassword123!}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StrongWpPassword123!}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network
    security_opt:
      - no-new-privileges:true

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wp_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-StrongRootPassword123!}
    ports:
      - "8080:80"
    networks:
      - wp_network
    depends_on:
      - db

  # WordPress
  wordpress:
    image: wordpress:latest
    container_name: wp_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-StrongWpPassword123!}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_network
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wp_network
    depends_on:
      - wordpress
    security_opt:
      - no-new-privileges:true

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: wp_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - wp_network
    security_opt:
      - no-new-privileges:true

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: wp_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-AdminStrong123!}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - wp_network
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  # Loki
  loki:
    image: grafana/loki:latest
    container_name: wp_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - wp_network

  # Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: wp_promtail
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - wp_network
    depends_on:
      - loki

networks:
  wp_network:
    driver: bridge

volumes:
  db_data:
  wp_data:
  prom_data:
  grafana_data:
